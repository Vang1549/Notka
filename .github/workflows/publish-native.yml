name: Publish Notka 2
on:
  push:
    branches: [main]
    paths: [next/publication.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notka-native-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install signature verifier
        run: python -m pip install cryptography==46.0.3
      - name: Publish immutable APK and activate native channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python next/tools/release.py --publish
